name = "chouka"
main = "worker.js"
compatibility_date = "2026-01-16"

# 1. KV: 用于缓存 Session、公告、预加载图片、排行榜快照
[[kv_namespaces]]
binding = "KV_CACHE"
id = "你的_KV_ID_用来存配置和缓存"

# 2. D1: 用于存储用户档案、积分、背包、日志 (强一致性)
[[d1_databases]]
binding = "DB"
database_name = "chouka"
database_id = "你的_D1_DATABASE_ID"

# 3. R2: 存储图片文件
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "你的_R2_BUCKET_NAME"

[vars]
# 管理员密码
ADMIN_PASSWORD = "change_this_password"