<!-- TopAppBar (Anchored Brand Component) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-3 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-b-4 border-pink-200 dark:border-pink-900 shadow-[0px_4px_0px_0px_rgba(255,119,175,0.2)]">
<div class="text-2xl font-black italic text-pink-600 dark:text-pink-300 drop-shadow-[2px_2px_0px_rgba(255,119,175,0.4)] font-['Plus_Jakarta_Sans']">

<div class="flex items-center gap-sm">
<button class="text-pink-500 dark:text-pink-400 font-['Plus_Jakarta_Sans'] font-bold tracking-tight hover:scale-105 transition-transform hover:text-pink-500 p-xs rounded-full">

</button>

<div class="absolute bottom-40 right-20 text-secondary-container opacity-60 animate-pulse" style="animation-delay: 0.5s;"><span class="material-symbols-outlined text-[60px]">colors_spark</span></div>

<div class="w-full max-w-6xl mt-margin mb-lg flex items-center justify-between relative z-10">
<button class="flex items-center gap-xs font-label-bold text-label-bold text-on-surface-variant hover:text-primary transition-colors bg-surface-container-low px-sm py-xs rounded-full border-2 border-outline-variant shadow-[2px_2px_0px_0px_var(--tw-colors-outline-variant)]">
<span class="material-symbols-outlined">arrow_back</span>

<h1 class="font-display-lg text-display-lg text-primary drop-shadow-[2px_2px_0px_var(--tw-colors-primary-container)]">Limit Break</h1>
</div>
<div class="w-[100px]"></div> <!-- Spacer for centering -->
</div>
<!-- Asymmetric Bento Grid Layout -->

<div class="w-full aspect-[3/4] rounded-xl border-4 border-primary bg-surface-container-lowest/80 backdrop-blur-md shadow-[8px_8px_0px_0px_var(--tw-colors-primary-fixed-dim)] transition-transform duration-300 ease-out group-hover:-rotate-2 group-hover:scale-[1.02] p-xs relative overflow-hidden flex flex-col">

<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-secondary rounded-tl-lg z-20 m-xs pointer-events-none"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-secondary rounded-br-lg z-20 m-xs pointer-events-none"></div>

<span class="font-label-bold text-label-bold">Lv. 80</span>
<span class="material-symbols-outlined text-[16px] text-tertiary-fixed">arrow_forward</span>
<span class="font-label-bold text-label-bold text-secondary-container">Lv. 90</span>
</div>
</div>
</div>
</div>

</div>
<div class="flex gap-sm flex-wrap">
<!-- Slot 1 (Filled) -->

<div class="absolute -bottom-2 -right-2 bg-on-surface text-surface font-label-bold text-[12px] px-2 py-[2px] rounded-full border-2 border-surface">15/10</div>
</div>
<!-- Slot 2 (Filled) -->
<div class="w-20 h-20 rounded-lg border-2 border-primary bg-primary-fixed/20 flex items-center justify-center relative shadow-[2px_2px_0px_0px_var(--tw-colors-primary-container)] hover:translate-y-[-2px] transition-transform cursor-pointer">

<div class="absolute -bottom-2 -right-2 bg-on-surface text-surface font-label-bold text-[12px] px-2 py-[2px] rounded-full border-2 border-surface">5/5</div>
</div>

<div class="w-20 h-20 rounded-lg border-4 border-dashed border-outline bg-surface-dim flex items-center justify-center relative hover:bg-surface-container-highest transition-colors cursor-pointer">

<div class="absolute -bottom-2 -right-2 bg-error text-on-error font-label-bold text-[12px] px-2 py-[2px] rounded-full border-2 border-surface">0/1</div>
</div>
</div>
</div>
<!-- Action Button -->
<button class="animate-sheen w-full py-md mt-sm bg-tertiary-fixed text-on-tertiary-fixed-variant font-button-text text-button-text text-[24px] rounded-full border-4 border-on-tertiary-fixed shadow-[0px_8px_0px_0px_var(--tw-colors-on-tertiary-fixed)] hover:translate-y-[4px] hover:shadow-[0px_4px_0px_0px_var(--tw-colors-on-tertiary-fixed)] active:translate-y-[8px] active:shadow-none transition-all relative overflow-hidden group">
<span class="relative z-10 flex items-center justify-center gap-xs drop-shadow-[1px_1px_0px_rgba(255,255,255,0.8)]">
<span class="material-symbols-outlined text-[28px]">auto_fix_high</span>
                        Synthesize
                    </span>
<!-- Glossy Sheen Overlay -->
<div class="sheen-layer absolute top-0 left-0 w-1/2 h-full bg-white/40 skew-x-[-20deg] -translate-x-[150%]"></div>
</button>
</div>
</div>
